function reducer(st, a) {
  switch(a.type) {
    // ── GLOBAL ──
    case "UNLOCK_PHASE": return {...st, unlockedPhases:[...new Set([...st.unlockedPhases,a.phase])], currentPhase:a.phase};

    // ── PHASE 1 ──
    case "GO":      return {...st, p1:{...st.p1, screen:a.screen}};
    case "DC_ANSWER": {
      const dcAnswers=[...st.p1.dcAnswers,a.idx];
      const dc2Answer=a.dcIdx===1?a.idx:st.p1.dc2Answer;
      return {...st,p1:{...st.p1,dcAnswers,dc2Answer,dcIdx:st.p1.dcIdx+1}};
    }
    case "LEAN":   return {...st,p1:{...st.p1,leans:st.p1.leans+1}};
    case "SHAPE":  { const shaped={...st.p1.shaped}; a.bs.forEach(b=>{shaped[b]=true;}); return {...st,p1:{...st.p1,shaped}}; }
    case "CARD":   return st.p1.cardsEarned.includes(a.card)?st:{...st,p1:{...st.p1,cardsEarned:[...st.p1.cardsEarned,a.card]}};
    case "BLIND":  return {...st,p1:{...st.p1,blindAns:a.val}};
    case "EXIT":   return {...st,p1:{...st.p1,exitAns:a.val}};
    case "TSTART": return {...st,p1:{...st.p1,timer:240,timerRunning:true}};
    case "TSTOP":  return {...st,p1:{...st.p1,timerRunning:false}};
    case "TICK":   return st.p1.timer<=1?{...st,p1:{...st.p1,timer:0,timerRunning:false}}:{...st,p1:{...st.p1,timer:st.p1.timer-1}};

    // ── PHASE 2 (wired for Sprint P2) ──
    case "GO_P2":  return {...st,p2:{...st.p2,screen:a.screen}};

    // ── PHASE 3 (wired for Sprint P3) ──
    case "GO_P3":  return {...st,p3:{...st.p3,screen:a.screen}};

    default: return st;
  }
}

async function callClaude(question, answer, criteria, signal) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:700,
        messages:[{role:"user",content:`Analytics training evaluator. Be direct and honest.\n\nQuestion: "${question}"\nStudent answer: "${answer}"\nCriteria:\n${criteria.map((c,i)=>`${i+1}. ${c}`).join("\n")}\n\nJSON only, no markdown:\n{"pass":boolean,"checklist":[{"criterion":"...","pass":boolean,"note":"max 8 words"}],"feedback":"2 sentences max"}`}]
      }),
    });
    const data = await res.json();
    const txt = data.content[0].text.replace(/\`\`\`json|\`\`\`/g,"").trim();
    return JSON.parse(txt);
  } catch(e) {
    if(e.name==="AbortError") return null;
    return {pass:answer.trim().length>50,checklist:criteria.map(c=>({criterion:c,pass:true,note:""})),feedback:"Response recorded."};
  }
}

function AIEval({question, answer, criteria, onPass, onFail}) {
  const [status, setStatus] = useState("thinking");
  const [result, setResult] = useState(null);
  useEffect(()=>{
    const ctrl = new AbortController();
    callClaude(question, answer, criteria, ctrl.signal).then(r=>{
      if(!r) return;
      setResult(r); setStatus("done");
    });
    return ()=>ctrl.abort();
  },[]);
  return html`
    <div class="ai-eval">
      <div class="ai-lbl">
        ${status==="thinking"
          ? html`<span>AI evaluating</span><div class="ai-dots"><span/><span/><span/></div>`
          : html`<span>Evaluation</span>`}
      </div>
      ${status==="done" && result && html`
        <p class="ai-txt ${result.pass?'ai-pass':'ai-fail'}">${result.pass?"✓ ":"✗ "}${result.feedback}</p>
        <div class="chk-list">

        </div>`}
    </div>`;
}

function MCQ({question, opts, correct, cons={}, hintId, onLean, onAny, isDC=false, dcData=null}) {
  const [sel, setSel] = useState(null);
  const [revealed, setRev] = useState(false);
  const [showFlash, setFlash] = useState(false);
  const [showHint, setHint] = useState(false);
  const isCorrect = sel === correct;
  const lock = () => {
    if(sel===null) return;
    setRev(true);
    setTimeout(()=>setFlash(true), 460);
  };
  const handleHint = () => { setHint(true); if(onLean) onLean(); };
  return html`
    <div>
      <div class="mcq-q">${question}</div>
      <div class="mcq-opts">
        ${opts.map((opt,i)=>{
          let cls="";
          if(revealed){ cls=i===correct?"correct":i===sel?"wrong":""; cls+=" locked"; }
          else { cls=i===sel?"sel":""; }
          return html`
            <button key=${i} class="mcq-opt ${cls}" onClick=${()=>!revealed&&setSel(i)}>
              <span class="mcq-letter">${String.fromCharCode(65+i)}</span>
              <div style="flex:1">
                <div class="mcq-txt">${opt}</div>
                ${isDC && revealed && dcData && html`<div class="mcq-expl">${dcData.explanations[i]}</div>`}
              </div>
            </button>`;
        })}
      </div>
      ${revealed && cons.targets && html`
        <div class="ttags">
          ${cons.targets.bs?.map(b=>html`<span key=${b} class="tag tag-b">${b}</span>`)}
          ${cons.targets.fs?.map(f=>html`<span key=${f} class="tag tag-f">${f}</span>`)}
        </div>`}
      ${!revealed && html`
        <div class="row mt">
          <button class="btn btn-p" disabled=${sel===null} onClick=${lock}>Lock in answer</button>
          ${hintId && !showHint && html`<button class="btn-hint" onClick=${handleHint}>Need a hint?</button>`}
        </div>`}
      ${showHint && !revealed && html`
        <div class="hint-box">
          <div class="hint-lbl">◈ Hint</div>
          <div class="hint-txt">"${HINTS[hintId]}"</div>
        </div>`}
      ${revealed && !isCorrect && cons[sel]!=null && html`
        <div class="card-r mt anim">
          <div class="clbl lr">⚠ Consequence</div>
          <p class="body-text">${cons[sel]}</p>
        </div>`}
      ${showFlash && html`
        ${cons.flash && html`
          <div class="card-o mt anim">
            <div class="clbl lo">◈ Domain flash</div>
            <p class="body-text">"${cons.flash}"</p>
          </div>`}
        <div class="row mt">
          <button class="btn btn-p" onClick=${()=>onAny&&onAny(sel,isCorrect)}>
            ${isCorrect?"Continue →":"Got it — continue →"}
          </button>
        </div>`}
    </div>`;
}

            <div class="gate-lbl">◈ Exit gate — your first 3 questions before touching any data</div>
            <div class="gate-q">What are your first three questions? Different industry. Different metric. No hints.</div>
            ${!submitted
              ? html`
                <textarea class="gate-ta" rows="5" value=${p1.exitAns}
                  onInput=${e=>dispatch({type:"EXIT",val:e.target.value})}
                  placeholder=${"Question 1: ...\nQuestion 2: ...\nQuestion 3: ..."}/>
                <div class="row mt">
                  <button class="btn btn-p" disabled=${!ready} onClick=${()=>setSubmitted(true)}>Submit →</button>
                </div>`
              : html`
                <div class="answered-txt">${p1.exitAns}</div>
                <${AIEval}
                  question="A PM at a B2B SaaS company says weekly active users dropped 9%. What are your first 3 questions before touching any data?"
                  answer=${p1.exitAns}
                  criteria=${[
                    "Question 1 targets metric definition (B1) — e.g. 'How exactly is WAU defined?'",
                    "Question 2 targets baseline / comparison period (B2) — e.g. 'Is 9% unusual for this product?'",
                    "Question 3 targets decomposition or metric type (B3 or B4)",
                  ]}
                  onPass=${()=>go(dispatch,S1.DEBRIEF)}
                  onFail=${()=>{ setSubmitted(false); dispatch({type:"EXIT",val:""}); }}/>`}
          </div>
        </div>
      </div>
      <${Prog} pct=${PCT1.EXIT_GATE} label="Phase 1 · Learn"/>
    </div>`;
}

function ScreenDebrief({p1, dispatch}) {
  const beforeText = ()=>{
    if(p1.dc2Answer===null) return "your instinct was to jump to data before defining what you were measuring.";
    if(p1.dc2Answer===DC[1].correct) return "you already knew notifications were the likely driver — but hadn't defined what DAU meant. Pattern-matched before metric was defined.";
    return `you thought the cause was "${DC[1].opts[p1.dc2Answer].toLowerCase()}" — before defining what DAU even measured.`;
  };
  const shapedCount = Object.values(p1.shaped).filter(Boolean).length;
  return html`
    <div class="aq">
      <${Hdr} mid="Debrief · Phase 1 Complete" showLeans=${false}/>
      <div class="main">
        <div class="wrap">
          <div class="act-lbl">Debrief · Your analytical fingerprint</div>
          <h2 class="sec-head">Phase 1 Complete.</h2>
          <p style="font-size:12px;color:rgba(232,227,219,.33);margin-bottom:22px;line-height:1.65;font-family:'DM Mono',monospace">
            Not a score. A mirror. Shows you your own growth.
          </p>
          <div class="card" style="margin-bottom:11px">
            <div class="clbl ld" style="margin-bottom:10px">Analytical fingerprint · Before & after</div>
            <div class="ba-grid">
              <div class="ba-bef">
                <div class="ba-lbl">Before Phase 1</div>
                <div class="ba-txt">When you heard "DAU dropped 12%" ${beforeText()}</div>
              </div>
              <div class="ba-aft">
                <div class="ba-lbl">After Phase 1</div>
                <div class="ba-txt">When you heard "AOV dropped 8%" your first instinct was to clarify the metric definition — before touching any data.</div>
              </div>
            </div>
            <div class="card-o">
              <p class="body-text">That shift — from data-first to definition-first — is the single most visible difference between junior and senior analytical thinking. You built it in one session.</p>
            </div>
          </div>
          <div class="card" style="margin-bottom:11px">
            <div class="clbl ld" style="margin-bottom:10px">Behaviours shaped · ${shapedCount} / 8</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 16px">
              ${BEHAVIOURS.map(b=>html`
                <div key=${b.key} class="beh-row ${p1.shaped[b.key]?'by':'bn'}">
                  <span class="beh-chk">${p1.shaped[b.key]?"✓":"○"}</span>
                  <span>${b.label}</span>
                </div>`)}
            </div>
            ${shapedCount<8 && html`
              <p style="font-size:11px;color:rgba(232,227,219,.26);margin-top:10px;font-family:'DM Mono',monospace">
                ${8-shapedCount} behaviour${8-shapedCount>1?"s":""} not demonstrated. Phase 2 will surface these.
              </p>`}
          </div>
          <div class="card" style="margin-bottom:11px">
            <div class="clbl ld" style="margin-bottom:10px">Domain cards · ${p1.cardsEarned.length} / ${ALL_CARDS.length} unlocked</div>
            ${ALL_CARDS.map(card=>html`
              <div key=${card} class="dc-item" style="opacity:${p1.cardsEarned.includes(card)?1:.26}">
                <span class="dc-ico">${p1.cardsEarned.includes(card)?"◈":"◇"}</span>
                <span>${card}</span>
              </div>`)}
          </div>
          <div class="card" style="margin-bottom:20px">
            <div class="clbl ld" style="margin-bottom:6px">Lean count · ${p1.leans} lean${p1.leans!==1?"s":""} used</div>
            <p class="body-text">
              ${p1.leans===0?"You drove this yourself. Senior analyst standard.":
                p1.leans<=2?`You used guidance ${p1.leans} time${p1.leans>1?"s":""}. Senior analysts typically need 0–1 on this case.`:
                `You leaned on guidance ${p1.leans} times. Phase 2 will show you what independent thinking feels like under no safety net.`}
            </p>
          </div>
          <div class="divider"/>
          <div style="text-align:center;padding:16px 0 8px">
            <p style="font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,255,255,.16);letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px">Phase 2 unlocked</p>
            <p style="font-size:12px;color:rgba(232,227,219,.36);margin-bottom:16px;line-height:1.65">
              Meesho GMV stagnation · No MCQs · Student drives · AI corrects
            </p>
            <button class="btn btn-p" style="opacity:.32;cursor:not-allowed">Begin Phase 2 → (coming soon)</button>
          </div>
        </div>
      </div>
      <${Prog} pct=${100} label="Phase 1 complete"/>
    </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 6B — PHASE 2 SCREENS (Sprint P2 — coming soon)
// ─────────────────────────────────────────────────────────────────────────────
function ScreenP2Brief({p2, dispatch}) {
  return html`<div class="aq"><${Hdr} mid="Phase 2 · Practice" showLeans=${false}/><div class="main"><div class="intro"><p class="eyebrow">Coming Soon</p><h1 class="display">Phase 2</h1></div></div></div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 6C — PHASE 3 SCREENS (Sprint P3 — coming soon)
// ─────────────────────────────────────────────────────────────────────────────
function ScreenP3Brief({p3, dispatch}) {
  return html`<div class="aq"><${Hdr} mid="Phase 3 · Perform" showLeans=${false}/><div class="main"><div class="intro"><p class="eyebrow">Coming Soon</p><h1 class="display">Phase 3</h1></div></div></div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 7 — ROOT
// Phase-aware router. Timer tick here. Single interval, never duplicated.
// ─────────────────────────────────────────────────────────────────────────────
const PHASE1_SCREENS = {
  [S1.INTRO]:ScreenIntro,[S1.DOMAIN_CAL]:ScreenDomainCal,[S1.DOMAIN_SCORE]:ScreenDomainScore,
  [S1.ACT1]:ScreenAct1,[S1.ACT1_GATE]:ScreenAct1Gate,
  [S1.ACT2_WIN]:ScreenAct2Win,[S1.ACT2_DECOMP]:ScreenAct2Decomp,[S1.ACT2_GATE]:ScreenAct2Gate,
  [S1.ACT3_HYP]:ScreenAct3Hyp,[S1.ACT3_RANK]:ScreenAct3Rank,[S1.ACT3_GATE]:ScreenAct3Gate,
  [S1.ACT4_SEG]:ScreenAct4Seg,[S1.ACT4_INTERP]:ScreenAct4Interp,[S1.ACT4_CONFIRM]:ScreenAct4Confirm,[S1.ACT4_GATE]:ScreenAct4Gate,
  [S1.ACT5_TRAP]:ScreenAct5Trap,[S1.ACT5_GATE]:ScreenAct5Gate,
  [S1.ACT6_BLIND]:ScreenAct6Blind,[S1.ACT6_EVAL]:ScreenAct6Eval,
  [S1.ACT7_RECOM]:ScreenAct7Recom,[S1.EXIT_GATE]:ScreenExitGate,[S1.DEBRIEF]:ScreenDebrief,
};

const PHASE2_SCREENS = { [S2.P2_BRIEF]:ScreenP2Brief };
const PHASE3_SCREENS = { [S3.P3_BRIEF]:ScreenP3Brief };

function App() {
  const [state, dispatch] = useReducer(reducer, INIT);

  // Timer tick — single interval at root, never duplicated
  useEffect(()=>{
    if(!state.p1.timerRunning) return;
    const id = setInterval(()=>dispatch({type:"TICK"}), 1000);
    return ()=>clearInterval(id);
  },[state.p1.timerRunning]);

  // Scroll to top on screen change
  useEffect(()=>{ window.scrollTo({top:0,behavior:"smooth"}); },[state.p1.screen, state.p2.screen, state.p3.screen]);

  // Phase-aware router
  const phaseState = state[`p${state.currentPhase}`];
  const screenMaps = { 1:PHASE1_SCREENS, 2:PHASE2_SCREENS, 3:PHASE3_SCREENS };
  const screenMap = screenMaps[state.currentPhase];
  const Screen = screenMap[phaseState.screen];

  // Pass phase-specific state + global state + dispatch
  return html`<${Screen} p1=${state.p1} p2=${state.p2} p3=${state.p3} dispatch=${dispatch}/>`;
}

render(html`<${App}/>`, document.getElementById("app"));
</script>
