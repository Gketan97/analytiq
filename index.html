<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Analytiq — The Analyst Flight Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="app"></div>
<script type="module">
import { html, render, useState, useEffect, useReducer, useRef } from 'https://cdn.jsdelivr.net/npm/htm/preact/standalone.module.js';

// ─────────────────────────────────────────────────────────────────────────────
// SECTION 1 — STYLES (Light Theme · Sprint 2A)
// ─────────────────────────────────────────────────────────────────────────────
const s = document.createElement("style");
s.textContent = `
/* ── RESET ───────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}

/* ── DESIGN TOKENS ───────────────────────────── */
:root {
  /* Colours — light theme */
  --bg:          #FFFFFF;
  --surface:     #F7F6F3;
  --surface-2:   #F0EEE9;
  --border:      #E4E2DD;
  --border-mid:  #D0CEC8;
  --text-1:      #1A1916;
  --text-2:      #6B6860;
  --text-3:      #A09D98;
  --accent:      #E05C1A;
  --accent-dim:  #F0956A;
  --accent-bg:   #FDF3EC;
  --accent-border:#F0956A;
  --green:       #1B7A4E;
  --green-bg:    #EEF7F2;
  --green-border:#A8D9BC;
  --red:         #C0392B;
  --red-bg:      #FDF2F1;
  --red-border:  #E8A49E;
  --blue:        #2D5BE3;
  --blue-bg:     #EEF1FD;
  --blue-border: #A3B4F0;
  --amber:       #B35A0A;
  --amber-bg:    #FEF6EC;
  --amber-border:#F0C98A;
  /* Typography */
  --ff-display: 'Plus Jakarta Sans', sans-serif;
  --ff-body:    'Inter', sans-serif;
  --ff-mono:    'JetBrains Mono', monospace;
  --fs-display: clamp(28px, 5vw, 48px);
  --fs-h1: 24px;
  --fs-h2: 20px;
  --fs-h3: 16px;
  --fs-body: 15px;
  --fs-body-sm: 14px;
  --fs-caption: 13px;
  --fs-mono: 13px;
  --fs-label: 11px;
  --fs-micro: 10px;
  --lh-display: 1.08;
  --lh-heading: 1.3;
  --lh-body: 1.72;
  --lh-mono: 1.6;
  /* Spacing */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  /* Radius */
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.04);
}

/* ── BASE ─────────────────────────────────────── */
body { background:var(--bg); font-family:var(--ff-body); color:var(--text-1); }

/* ── ANIMATIONS ───────────────────────────────── */
@keyframes fadeUp   { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn   { from{opacity:0} to{opacity:1} }
@keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.3} }
@keyframes slideIn  { from{opacity:0;transform:translateX(8px)} to{opacity:1;transform:translateX(0)} }
@keyframes rowIn    { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
@keyframes scaleIn  { from{opacity:0;transform:scale(.97)} to{opacity:1;transform:scale(1)} }

/* ── REDUCED MOTION ───────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── APP SHELL ────────────────────────────────── */
.aq { min-height:100vh; background:var(--bg); color:var(--text-1); overflow-x:hidden; }

/* ── HEADER ───────────────────────────────────── */
.hdr {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:52px; padding:0 24px;
  display:flex; align-items:center; justify-content:space-between;
  background:rgba(255,255,255,.95); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.hdr-logo {
  font-family:var(--ff-display); font-size:14px; font-weight:800;
  letter-spacing:.12em; color:var(--accent); text-transform:uppercase;
}
.hdr-mid {
  font-family:var(--ff-mono); font-size:var(--fs-micro);
  color:var(--text-3); letter-spacing:.1em; text-transform:uppercase;
}
.hdr-right { display:flex; align-items:center; gap:6px; }
.hdr-lbl { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--text-3); letter-spacing:.06em; }
.lean-wrap { display:flex; align-items:center; gap:4px; position:relative; cursor:default; }
.lean-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--border); border:1.5px solid var(--border-mid);
  transition:all .25s;
}
.lean-dot.on { background:var(--accent); border-color:var(--accent); }
.lean-overflow { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--text-3); }
.lean-tooltip {
  position:absolute; top:calc(100% + 6px); right:0;
  background:var(--text-1); color:var(--bg);
  font-family:var(--ff-mono); font-size:var(--fs-micro);
  padding:5px 9px; border-radius:var(--r-sm); white-space:nowrap;
  opacity:0; pointer-events:none; transition:opacity .15s; z-index:100;
}
.lean-wrap:hover .lean-tooltip { opacity:1; }

/* ── CARD COUNTER ─────────────────────────────── */
.card-counter {
  font-family:var(--ff-mono); font-size:var(--fs-micro);
  color:var(--accent); letter-spacing:.06em;
  background:var(--accent-bg); border:1px solid var(--accent-border);
  border-radius:var(--r-sm); padding:2px 7px;
  cursor:pointer; transition:background .15s;
}
.card-counter:hover { background:var(--accent-dim); color:white; }

/* ── PROGRESS BAR ─────────────────────────────── */
.prog {
  position:fixed; bottom:0; left:0; right:0; z-index:200;
  padding:10px 24px 14px;
  background:linear-gradient(transparent, rgba(255,255,255,.98) 30%);
}
.prog-track { height:2px; background:var(--border); border-radius:1px; overflow:hidden; margin-bottom:6px; }
.prog-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-dim)); border-radius:1px; transition:width .5s ease; }
.prog-lbl { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--text-3); letter-spacing:.1em; text-transform:uppercase; text-align:center; }

/* ── LAYOUT ───────────────────────────────────── */
.main { position:relative; padding-top:52px; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
.wrap { width:100%; max-width:648px; padding:32px 24px 88px; animation:fadeUp .35s ease; }
.intro { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 52px); text-align:center; padding:32px 24px; animation:fadeIn .5s ease; }

/* ── TYPOGRAPHY ───────────────────────────────── */
.eyebrow {
  font-family:var(--ff-mono); font-size:var(--fs-label);
  color:var(--accent); letter-spacing:.2em; text-transform:uppercase;
  margin-bottom:var(--sp-5);
}
.display {
  font-family:var(--ff-display); font-size:var(--fs-display);
  font-weight:800; line-height:var(--lh-display); color:var(--text-1);
  margin-bottom:var(--sp-3);
}
.h2 {
  font-family:var(--ff-display); font-size:var(--fs-h2);
  font-weight:700; line-height:var(--lh-heading); color:var(--text-1);
  margin-bottom:var(--sp-2);
}
.h3 {
  font-family:var(--ff-display); font-size:var(--fs-h3);
  font-weight:700; line-height:var(--lh-heading); color:var(--text-1);
  margin-bottom:var(--sp-2);
}
.act-eyebrow {
  font-family:var(--ff-mono); font-size:var(--fs-label);
  color:var(--accent); letter-spacing:.18em; text-transform:uppercase;
  margin-bottom:var(--sp-4); display:flex; align-items:center; gap:10px;
}
.act-eyebrow::after { content:''; flex:1; height:1px; background:var(--accent-border); opacity:.4; }
.scene-lbl {
  font-family:var(--ff-mono); font-size:var(--fs-micro);
  color:var(--text-3); letter-spacing:.12em; text-transform:uppercase; margin-bottom:4px;
}
.body { font-size:var(--fs-body); line-height:var(--lh-body); color:var(--text-2); }
.body strong { color:var(--text-1); font-weight:600; }
.body-sm { font-size:var(--fs-body-sm); line-height:var(--lh-body); color:var(--text-2); }
.caption { font-size:var(--fs-caption); line-height:var(--lh-body); color:var(--text-3); }
.mono { font-family:var(--ff-mono); }
.divider { height:1px; background:var(--border); margin:var(--sp-5) 0; }

/* ── BUTTONS ──────────────────────────────────── */
.btn { font-family:var(--ff-mono); font-size:var(--fs-label); letter-spacing:.08em; text-transform:uppercase; border:none; border-radius:var(--r-sm); padding:10px 22px; cursor:pointer; transition:all .14s; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
.btn-p { color:#fff; background:var(--accent); }
.btn-p:hover:not(:disabled) { background:#c95016; transform:translateY(-1px); box-shadow:var(--shadow-sm); }
.btn-p:disabled { opacity:.35; cursor:default; transform:none; box-shadow:none; }
.btn-g { color:var(--text-2); background:transparent; border:1px solid var(--border-mid); }
.btn-g:hover { border-color:var(--text-3); color:var(--text-1); }
.btn-hint { font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; color:var(--amber); background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:var(--r-sm); padding:7px 13px; cursor:pointer; transition:all .14s; }
.btn-hint:hover { background:var(--amber); color:#fff; border-color:var(--amber); }
.btn-text { font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.06em; text-transform:uppercase; color:var(--blue); background:none; border:none; cursor:pointer; text-decoration:underline; text-underline-offset:2px; padding:0; }

/* ── CARDS ────────────────────────────────────── */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--sp-4) var(--sp-5); }
.card-o { background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:var(--r-md); padding:var(--sp-4) var(--sp-5); }
.card-g { background:var(--green-bg); border:1px solid var(--green-border); border-radius:var(--r-md); padding:var(--sp-4) var(--sp-5); }
.card-r { background:var(--red-bg); border:1px solid var(--red-border); border-radius:var(--r-md); padding:var(--sp-4) var(--sp-5); }
.card-b { background:var(--blue-bg); border:1px solid var(--blue-border); border-radius:var(--r-md); padding:var(--sp-4) var(--sp-5); }
.clbl { font-family:var(--ff-mono); font-size:var(--fs-micro); letter-spacing:.14em; text-transform:uppercase; margin-bottom:var(--sp-2); }
.co { color:var(--amber); } .cg { color:var(--green); } .cr { color:var(--red); } .cb { color:var(--blue); } .cd { color:var(--text-3); }

/* ── PHASE CARDS ──────────────────────────────── */
.phase-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:var(--sp-8); width:100%; max-width:460px; }
.phase-card { padding:14px 10px; border:1.5px solid var(--border); border-radius:var(--r-md); text-align:center; background:var(--surface); position:relative; }
.phase-card.active { border-color:var(--accent); background:var(--accent-bg); }
.pc-lbl { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--text-3); letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
.phase-card.active .pc-lbl { color:var(--accent); }
.pc-name { font-family:var(--ff-display); font-size:13px; font-weight:700; color:var(--text-3); }
.phase-card.active .pc-name { color:var(--text-1); }
.pc-lock { font-size:10px; color:var(--text-3); margin-top:3px; font-family:var(--ff-mono); }
.phase-card.active .pc-lock { display:none; }

/* ── SLACK COMPONENT ──────────────────────────── */
.slack { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:14px 16px; margin-bottom:var(--sp-4); box-shadow:var(--shadow-sm); }
.slack-ch { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--text-3); letter-spacing:.1em; text-transform:uppercase; padding-bottom:10px; margin-bottom:12px; border-bottom:1px solid var(--border); }
.slack-row { display:flex; gap:10px; align-items:flex-start; margin-bottom:12px; animation:slideIn .3s ease; }
.slack-row:last-child { margin-bottom:0; }
.slack-av { width:30px; height:30px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:var(--ff-display); font-size:10px; font-weight:700; }
.av-pm  { background:#E8F0FE; color:#1A73E8; }
.av-you { background:var(--accent-bg); color:var(--accent); }
.av-sup { background:#F3E8FD; color:#7B2FBE; }
.av-mon { background:#E8FDF0; color:#1B7A4E; }
.av-aj  { background:rgba(180,100,30,.12); color:#B46B1A; }
.slack-name { font-size:13px; font-weight:600; color:var(--text-1); margin-bottom:2px; }
.slack-name span { font-size:var(--fs-micro); color:var(--text-3); font-weight:400; margin-left:6px; font-family:var(--ff-mono); }
.slack-txt { font-size:var(--fs-body-sm); line-height:var(--lh-body); color:var(--text-2); }
.slack-typing { display:flex; align-items:center; gap:4px; padding:4px 0; }
.slack-typing span { width:5px; height:5px; border-radius:50%; background:var(--text-3); animation:pulse 1.2s ease infinite; }
.slack-typing span:nth-child(2) { animation-delay:.2s; }
.slack-typing span:nth-child(3) { animation-delay:.4s; }

/* ── MCQ ─────────────────────────────────────── */
.mcq-q { font-size:var(--fs-body); line-height:var(--lh-body); color:var(--text-1); margin-bottom:12px; padding:12px 16px; background:var(--surface); border-left:3px solid var(--accent-dim); border-radius:0 var(--r-sm) var(--r-sm) 0; font-weight:500; }
.mcq-opts { display:flex; flex-direction:column; gap:7px; }
.mcq-opt { display:flex; align-items:flex-start; gap:10px; padding:11px 14px; border:1.5px solid var(--border); border-radius:var(--r-md); cursor:pointer; transition:all .13s; background:var(--bg); width:100%; text-align:left; }
.mcq-opt:hover:not(.locked) { border-color:var(--border-mid); background:var(--surface); box-shadow:var(--shadow-sm); }
.sel { border-color:var(--accent)!important; background:var(--accent-bg)!important; }
.correct { border-color:var(--green)!important; background:var(--green-bg)!important; }
.wrong { border-color:var(--red)!important; background:var(--red-bg)!important; }
.locked { cursor:default; }
.mcq-letter { font-family:var(--ff-mono); font-size:var(--fs-micro); font-weight:500; color:var(--text-3); flex-shrink:0; padding-top:2px; width:14px; }
.sel .mcq-letter { color:var(--accent); }
.correct .mcq-letter { color:var(--green); }
.wrong .mcq-letter { color:var(--red); }
.mcq-txt { font-size:var(--fs-body-sm); line-height:1.55; color:var(--text-2); }
.sel .mcq-txt, .correct .mcq-txt { color:var(--text-1); }
.mcq-expl { font-size:12px; line-height:1.55; color:var(--text-3); margin-top:5px; padding-top:5px; border-top:1px solid var(--border); animation:fadeIn .25s ease; font-style:italic; }
.correct .mcq-expl { color:var(--green); }
.wrong .mcq-expl { color:var(--red); }
.ttags { display:flex; gap:4px; flex-wrap:wrap; margin-top:10px; animation:fadeIn .3s ease; }
.tag { font-family:var(--ff-mono); font-size:var(--fs-micro); padding:2px 7px; border-radius:2px; letter-spacing:.06em; text-transform:uppercase; }
.tag-b { background:var(--blue-bg); color:var(--blue); border:1px solid var(--blue-border); }
.tag-f { background:var(--red-bg); color:var(--red); border:1px solid var(--red-border); }

/* ── HINT BOX ─────────────────────────────────── */
.hint-box { background:var(--amber-bg); border:1px solid var(--amber-border); border-radius:var(--r-md); padding:10px 14px; margin-top:8px; animation:fadeUp .25s ease; }
.hint-lbl { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--amber); letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
.hint-txt { font-size:var(--fs-body-sm); line-height:var(--lh-body); color:var(--text-2); font-style:italic; }

/* ── GATE (Arjun eval) ────────────────────────── */
.gate { background:var(--blue-bg); border:1px solid var(--blue-border); border-radius:var(--r-md); padding:var(--sp-4) var(--sp-5); animation:fadeUp .35s ease; }
.gate-lbl { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--blue); letter-spacing:.16em; text-transform:uppercase; margin-bottom:6px; }
.gate-q { font-size:var(--fs-body-sm); line-height:var(--lh-body); color:var(--text-1); margin-bottom:var(--sp-3); font-weight:500; }
.gate-hint { font-size:12px; color:var(--text-3); font-style:italic; margin-bottom:var(--sp-3); }
.gate-ta { width:100%; background:var(--bg); border:1.5px solid var(--border-mid); border-radius:var(--r-sm); padding:10px 12px; color:var(--text-1); font-family:var(--ff-body); font-size:var(--fs-body-sm); line-height:var(--lh-body); resize:none; outline:none; transition:border-color .15s; min-height:90px; }
.gate-ta:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(45,91,227,.1); }
.gate-ta::placeholder { color:var(--text-3); }
.word-count { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--text-3); text-align:right; margin-top:4px; }
.word-count.ready { color:var(--green); }

/* ── ARJUN EVAL ───────────────────────────────── */
.arjun-eval { background:var(--bg); border:1.5px solid var(--border); border-radius:var(--r-md); padding:var(--sp-4); margin-top:var(--sp-3); animation:fadeUp .3s ease; }
.arjun-lbl { font-family:var(--ff-mono); font-size:var(--fs-micro); color:var(--text-3); letter-spacing:.12em; text-transform:uppercase; margin-bottom:var(--sp-3); display:flex; align-items:center; gap:8px; }
.arjun-av { width:28px; height:28px; border-radius:6px; background:rgba(180,100,30,.12); color:#B46B1A; display:flex; align-items:center; justify-content:center; font-family:var(--ff-display); font-size:10px; font-weight:700; flex-shrink:0; }
.arjun-name { font-size:var(--fs-caption); font-weight:600; color:var(--text-1); }
.arjun-title { font-size:var(--fs-micro); color:var(--text-3); font-family:var(--ff-mono); }
.arjun-dots span { display:inline-block; width:4px; height:4px; border-radius:50%; background:var(--text-3); animation:pulse 1.2s ease infinite; }
.arjun-dots span:nth-child(2) { animation-delay:.2s; }
.arjun-dots span:nth-child(3) { animation-delay:.4s; }
.arjun-txt { font-size:var(--fs-body-sm); line-height:var(--lh-body); color:var(--text-2); margin-bottom:var(--sp-3); }
.arjun-pass { color:var(--green); font-weight:500; }
.arjun-fail { color:var(--red); font-weight:500; }
.arjun-unavail { color:var(--text-3); font-style:italic; }
.chk-list { display:flex; flex-direction:column; gap:5px; margin-bottom:var(--sp-3); }
.chk-item { display:flex; align-items:flex-start; gap:7px; font-size:12px; color:var(--text-2); line-height:1.55; }
.chk-p .chk-ico { color:var(--green); }
.chk-f .chk-ico { color:var(--red); }
.chk-ico { font-family:var(--ff-mono); font-size:var(--fs-micro); flex-shrink:0; padding-top:2px; }
.answered-txt { padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); font-size:var(--fs-body-sm); color:var(--text-2); line-height:var(--lh-body); margin-bottom:var(--sp-3); font-style:italic; }

/* ── DATA TABLE ───────────────────────────────── */
.dtbl { background:var(--bg); border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; font-family:var(--ff-mono); font-size:12px; margin-top:var(--sp-3); box-shadow:var(--shadow-sm); }
.dtbl-hdr { display:grid; padding:8px 14px; background:var(--surface); border-bottom:1px solid var(--border); color:var(--text-3); font-size:var(--fs-micro); letter-spacing:.08em; text-transform:uppercase; }
.dtbl-row { display:grid; padding:8px 14px; border-bottom:1px solid var(--border); color:var(--text-2); transition:background .12s; }
.dtbl-row:last-child { border-bottom:none; }
.dtbl-row:hover { background:var(--surface); }
.dtbl-row.animating { animation:rowIn .3s ease; }
.pos { color:var(--green); font-weight:500; }

function reducer(st, a) {
  switch(a.type) {
    case "UNLOCK_PHASE": return {...st, unlockedPhases:[...new Set([...st.unlockedPhases,a.phase])], currentPhase:a.phase};
    case "GO":      return {...st, p1:{...st.p1, screen:a.screen}};
    case "DC_ANSWER": {
      const dcAnswers=[...st.p1.dcAnswers,a.idx];
      const dc2Answer=a.dcIdx===1?a.idx:st.p1.dc2Answer;
      return {...st,p1:{...st.p1,dcAnswers,dc2Answer,dcIdx:st.p1.dcIdx+1}};
    }
    case "LEAN":   return {...st,p1:{...st.p1,leans:st.p1.leans+1}};
    case "SHAPE":  { const shaped={...st.p1.shaped}; a.bs.forEach(b=>{shaped[b]=true;}); return {...st,p1:{...st.p1,shaped}}; }
    case "CARD":   return st.p1.cardsEarned.includes(a.card)?st:{...st,p1:{...st.p1,cardsEarned:[...st.p1.cardsEarned,a.card]}};
    case "BLIND":  return {...st,p1:{...st.p1,blindAns:a.val}};
    case "EXIT":   return {...st,p1:{...st.p1,exitAns:a.val}};
    case "TSTART": return {...st,p1:{...st.p1,timer:360,timerRunning:true}};
    case "TSTOP":  return {...st,p1:{...st.p1,timerRunning:false}};
    case "TICK":   return st.p1.timer<=1?{...st,p1:{...st.p1,timer:0,timerRunning:false}}:{...st,p1:{...st.p1,timer:st.p1.timer-1}};
    case "GO_P2":  return {...st,p2:{...st.p2,screen:a.screen}};
    case "GO_P3":  return {...st,p3:{...st.p3,screen:a.screen}};
    default: return st;
  }
}

async function callArjun(question, answer, criteria, signal) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", signal,
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:700,
        messages:[{role:"user",content:`You are Arjun Mehta — Principal Analytics Mentor, 10+ years at Flipkart, Swiggy, and Razorpay. You have sat on both sides of hundreds of analytics interviews. You do not soften feedback — but you never criticise the person, only the thinking. You treat everyone as capable of better. You are a senior colleague debriefing after a presentation, not a teacher grading a test. Never say "great job" or "well done." If they got it right, say "That's the right instinct. Here's why it matters." First person. Direct address.

Evaluate this response for an analytics training simulation.

Question asked: "${question}"
Student's answer: "${answer}"
Evaluation criteria:
${criteria.map((c,i)=>`${i+1}. ${c}`).join("\n")}

Respond ONLY in JSON (no markdown, no preamble):
{"pass":boolean,"checklist":[{"criterion":"...","pass":boolean,"note":"max 10 words, Arjun's voice"}],"feedback":"Arjun's feedback — 2-3 sentences max. Direct. References specific evidence from their answer. If pass: acknowledge what was right and add what to watch for. If fail: name the specific thinking error, not just 'incorrect'. End with: 'Revise and resubmit — specifically address: [the gap]' if failing."}`}]
      }),
    });
    const data = await res.json();
    const txt = data.content[0].text.replace(/```json|```/g,"").trim();
    return JSON.parse(txt);
  } catch(e) {
    if(e.name==="AbortError") return null;
    return null; // Arjun unavailable — not auto-pass
  }
}

function ArjunEval({question, answer, criteria, onPass, onFail, isExitGate=false}) {
  const [status, setStatus] = useState("thinking");
  const [result, setResult] = useState(null);
  useEffect(()=>{
    const ctrl = new AbortController();
    callArjun(question, answer, criteria, ctrl.signal).then(r=>{
      if(!r) { setStatus("unavail"); return; }
      setResult(r); setStatus("done");
    });
    return ()=>ctrl.abort();
  },[]);

  return html`
    <div class="arjun-eval">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="arjun-av">AJ</div>
        <div>
          <div class="arjun-name">Arjun Mehta</div>
          <div class="arjun-title">Principal Analytics Mentor · Flipkart, Swiggy, Razorpay</div>
        </div>
        ${status==="thinking" && html`<div class="arjun-dots" style="margin-left:auto"><span/><span/><span/></div>`}
      </div>
      ${status==="thinking" && html`
        <div class="body-sm" style="color:var(--text-3);font-style:italic">Arjun is reviewing your response...</div>`}
      ${status==="unavail" && html`
        <div class="body-sm arjun-unavail">Arjun is unavailable right now. Try again in a moment.</div>
        <div class="row mt">
          <button class="btn btn-g" onClick=${()=>{ setStatus("thinking"); setResult(null); callArjun(question,answer,criteria,new AbortController().signal).then(r=>{ if(!r){setStatus("unavail");return;} setResult(r);setStatus("done"); }); }}>Try again</button>
        </div>`}
      ${status==="done" && result && html`
        <div class="arjun-txt ${result.pass?'arjun-pass':'arjun-fail'}">${result.feedback}</div>
        <div class="chk-list">
          ${result.checklist.map((item,i)=>html`
            <div key=${i} class="chk-item ${item.pass?'chk-p':'chk-f'}">
              <span class="chk-ico">${item.pass?"◆":"◇"}</span>
              <span>${item.criterion}${item.note?` — ${item.note}`:""}</span>
            </div>`)}
        </div>
        <div class="row mt">
          ${result.pass
            ? html`<button class="btn btn-p" onClick=${onPass}>Continue →</button>`
            : html`<button class="btn btn-g" onClick=${onFail}>Revise answer →</button>`}
        </div>`}
    </div>`;
}

// Gate Component — wraps ArjunEval
function Gate({question, criteria, onPass, hintText, isExitGate=false}) {
  const [ans, setAns] = useState("");
  const [sub, setSub] = useState(false);
  const wc = wordCount(ans);
  const ready = wc >= (isExitGate ? 30 : 20);
  return html`
    <div class="gate">
      <div class="gate-lbl">◈ Arjun is reviewing — write your answer</div>
      <div class="gate-q">${question}</div>
      ${hintText && html`<div class="gate-hint">${hintText}</div>`}
      ${!sub
        ? html`
          <textarea class="gate-ta" value=${ans} rows="4"
            onInput=${e=>setAns(e.target.value)}
            placeholder="Type your response..."/>
          <div class="word-count ${ready?'ready':''}">
            ${wc} / ${isExitGate?30:20} words minimum${ready?" ✓":""}
          </div>
          <div class="row mt">
            <button class="btn btn-p" disabled=${!ready} onClick=${()=>setSub(true)}>
              ${ready?"Submit to Arjun →":"Write more..."}
            </button>
          </div>`
        : html`
          <div class="answered-txt">${ans}</div>
          <${ArjunEval} question=${question} answer=${ans} criteria=${criteria}
            isExitGate=${isExitGate}
            onPass=${onPass}
            onFail=${()=>setSub(false)}/>`}
    </div>`;
}

// ExitGate — hard pass/fail, preserves answer on retry
function ExitGate({question, criteria, onPass, initAns, onUpdate}) {
  const [sub, setSub] = useState(false);
  const [ans, setAns] = useState(initAns||"");
  const wc = wordCount(ans);
  const ready = wc >= 30;
  const handleChange = (val) => { setAns(val); if(onUpdate) onUpdate(val); };
  return html`
    <div class="gate">
      <div class="gate-lbl">◈ Exit gate — Arjun reads this. Hard pass/fail.</div>
      <div class="gate-q">${question}</div>
      <div class="gate-hint">Three questions. One per behaviour: metric definition, baseline, decomposition. In any order.</div>
      ${!sub
        ? html`
          <textarea class="gate-ta" value=${ans} rows="5"
            onInput=${e=>handleChange(e.target.value)}
            placeholder=${"Question 1: ...\nQuestion 2: ...\nQuestion 3: ..."}/>
          <div class="word-count ${ready?'ready':''}">
            ${wc} / 30 words minimum${ready?" ✓":""}
          </div>
          <div class="row mt">
            <button class="btn btn-p" disabled=${!ready} onClick=${()=>setSub(true)}>Submit to Arjun →</button>
          </div>`
        : html`
          <div class="answered-txt">${ans}</div>
          <${ArjunEval}
            question=${question} answer=${ans} criteria=${criteria}
            isExitGate=${true}
            onPass=${onPass}
            onFail=${()=>setSub(false)}/>`}
    </div>`;
}

function MCQ({question, opts, correct, cons={}, hintId, onLean, onAny, isDC=false, dcData=null}) {
  const [sel, setSel] = useState(null);
  const [revealed, setRev] = useState(false);
  const [showFlash, setFlash] = useState(false);
  const [showHint, setHint] = useState(false);
  const isCorrect = sel === correct;
  const lock = () => {
    if(sel===null) return;
    setRev(true);
    if(!isDC) setTimeout(()=>setFlash(true), 1400);
    else setTimeout(()=>setFlash(true), 400);
  };
  const handleHint = () => { setHint(true); if(onLean) onLean(); };
  return html`
    <div>
      <div class="mcq-q">${question}</div>
      <div class="mcq-opts">
        ${opts.map((opt,i)=>{
          let cls="";
          if(revealed){ cls=i===correct?"correct":i===sel?"wrong":""; cls+=" locked"; }
          else { cls=i===sel?"sel":""; }
          return html`
            <button key=${i} class="mcq-opt ${cls}" onClick=${()=>!revealed&&setSel(i)}>
              <span class="mcq-letter">${String.fromCharCode(65+i)}</span>
              <div style="flex:1">
                <div class="mcq-txt">${opt}</div>
                ${isDC && revealed && dcData && html`<div class="mcq-expl">${dcData.explanations[i]}</div>`}
              </div>
            </button>`;
        })}
      </div>
      ${revealed && cons.targets && html`
        <div class="ttags">
          ${cons.targets.bs?.map(b=>html`<span key=${b} class="tag tag-b">${b}</span>`)}
          ${cons.targets.fs?.map(f=>html`<span key=${f} class="tag tag-f">${f}</span>`)}
        </div>`}
      ${revealed && !isCorrect && sel!==null && cons[sel] && html`
        <div class="card-r mt anim">
          <div class="clbl cr">⚠ Consequence</div>
          <p class="body-sm mt-sm">${cons[sel]}</p>
        </div>`}
      ${!revealed && html`
        <div class="row mt">
          <button class="btn btn-p" disabled=${sel===null} onClick=${lock}>Lock in answer</button>
          ${hintId && !showHint && html`<button class="btn-hint" onClick=${handleHint}>Arjun's hint?</button>`}
        </div>`}
      ${showHint && !revealed && html`
        <div class="hint-box mt">
          <div class="hint-lbl">Arjun's hint:</div>
          <div class="hint-txt">"${HINTS[hintId]}"</div>
        </div>`}
      ${showFlash && cons.flash && html`
        <div class="card-o mt anim">
          <div class="clbl co">◈ Domain flash</div>
          <p class="body-sm mt-sm">"${cons.flash}"</p>
        </div>`}
      ${showFlash && html`
        <div class="row mt">
          <button class="btn btn-p" onClick=${()=>onAny&&onAny(sel,isCorrect)}>
            ${isCorrect?"Continue →":"Got it — continue →"}
          </button>
        </div>`}
    </div>`;
}

// Animated data table rows
function DataTable({cols, rows, grid, animate=false}) {
  const [visRows, setVisRows] = useState(animate ? 0 : rows.length);
  useEffect(()=>{
    if(!animate) return;
    let i = 0;
    const interval = setInterval(()=>{ i++; setVisRows(i); if(i>=rows.length) clearInterval(interval); }, 180);
    return ()=>clearInterval(interval);
  },[]);
  const visible = rows.slice(0, visRows);
  return html`
    <div class="dtbl">
      <div class="dtbl-hdr" style="grid-template-columns:${grid}">
        ${cols.map(c=>html`<span key=${c}>${c}</span>`)}
      </div>
      ${visible.map((row,i)=>html`
        <div key=${i} class="dtbl-row ${animate?'animating':''}" style="grid-template-columns:${grid};font-weight:${row.bold?600:400};border-top:${row.sep?"1px solid var(--border)":"none"}">
          ${row.cells.map((cell,j)=>html`<span key=${j} class="${cell.cls||""}">${cell.v}</span>`)}
        </div>`)}
    </div>`;
}

  return html`

      ${step===0 && html`
        <div class="read-prompt">
          <button class="btn btn-g" onClick=${()=>setStep(1)}>I've read this →</button>
        </div>`}
      ${step===1 && html`<div class="reveal-animate">${questionNode}</div>`}
    </div>`;
}

  };
  const shapedCount = Object.values(p1.shaped).filter(Boolean).length;
  return html`
    <div class="aq">
      <${Hdr} mid="Debrief · Phase 1 Complete" showLeans=${false}/>
      <div class="main">
        <div class="wrap">
          <div class="act-eyebrow">Debrief · Your analytical fingerprint</div>

          </div>

                <div key=${b.key} class="beh-row ${p1.shaped[b.key]?'by':'bn'}">

const PHASE1_SCREENS = {
  [S1.INTRO]:ScreenIntro, [S1.HOW]:ScreenHow, [S1.PRIMER]:ScreenPrimer,
  [S1.DOMAIN_CAL]:ScreenDomainCal, [S1.DOMAIN_SCORE]:ScreenDomainScore,
  [S1.ACT1]:ScreenAct1, [S1.ACT1_GATE]:ScreenAct1Gate,
  [S1.ACT2_WIN]:ScreenAct2Win, [S1.ACT2_DECOMP]:ScreenAct2Decomp, [S1.ACT2_GATE]:ScreenAct2Gate,

  [S1.ACT4_SEG]:ScreenAct4Seg, [S1.ACT4_INTERP]:ScreenAct4Interp,
  [S1.ACT4_CONFIRM]:ScreenAct4Confirm, [S1.ROOT_CONFIRM]:ScreenRootConfirm,
  [S1.ACT4_GATE]:ScreenAct4Gate,
  [S1.ACT5_BEAT]:ScreenAct5Beat, [S1.ACT5_TRAP]:ScreenAct5Trap, [S1.ACT5_GATE]:ScreenAct5Gate,
  [S1.ACT6_BLIND]:ScreenAct6Blind, [S1.ACT6_EVAL]:ScreenAct6Eval,
  [S1.ACT7_RECOM]:ScreenAct7Recom, [S1.EXIT_GATE]:ScreenExitGate, [S1.DEBRIEF]:ScreenDebrief,
};
const PHASE2_SCREENS = { [S2.P2_BRIEF]:ScreenP2Brief };
const PHASE3_SCREENS = { [S3.P3_BRIEF]:ScreenP3Brief };

function App() {
  const [state, dispatch] = useReducer(reducer, INIT);

  useEffect(()=>{
    if(!state.p1.timerRunning) return;
    const id = setInterval(()=>dispatch({type:"TICK"}), 1000);
    return ()=>clearInterval(id);
  },[state.p1.timerRunning]);

  useEffect(()=>{ window.scrollTo({top:0,behavior:"smooth"}); },[state.p1.screen, state.p2.screen, state.p3.screen]);

  const phaseState = state[`p${state.currentPhase}`];
  const screenMaps = { 1:PHASE1_SCREENS, 2:PHASE2_SCREENS, 3:PHASE3_SCREENS };
  const screenMap = screenMaps[state.currentPhase];
  const Screen = screenMap[phaseState.screen];
  return html`<${Screen} p1=${state.p1} p2=${state.p2} p3=${state.p3} dispatch=${dispatch}/>`;
}

render(html`<${App}/>`, document.getElementById("app"));
